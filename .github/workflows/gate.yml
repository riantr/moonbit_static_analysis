name: gate

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # v5 -> v6 -> v7. Both majors are safe for THIS file and the reasons are
      # worth recording, because "just bump it" is how a release gate breaks:
      #   v6 persists credentials to a separate file instead of .git/config.
      #     Harmless here: no step in this workflow runs git, and nothing pushes
      #     from CI -- the tag is pushed locally and this job only reads.
      #   v7 refuses to check out fork PRs for `pull_request_target` and
      #     `workflow_run`. This workflow triggers on push, tags and plain
      #     `pull_request`, none of which are affected.
      - uses: actions/checkout@v7
      # Installed from the official script rather than a setup action, because
      # the action this file used to reference does not exist:
      #   moonbitlang/setup-moonbit  -> 404, repository not found
      # and the near-miss replacement, moonbit-community/setup-moonbit, has zero
      # tags and zero releases, so any @vN ref fails the same way. An action
      # referenced by a workflow is resolved during job setup, which is why that
      # typo failed every run at "Set up job" instead of at a named step, and
      # why this gate had never once produced a result.
      #
      # The path is install/unix.sh, not install.sh: the latter answers 403 even
      # from a GitHub runner, which is what the first fixed run failed with
      # (curl exit 22).
      #
      # The version check at the end is not decoration: without it a silently
      # failed install would surface three steps later as a confusing
      # "moon: command not found" inside `moon check`.
      - name: Install moon
        run: |
          set -euo pipefail
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          # The installer puts moon under $MOON_HOME/bin (default ~/.moon/bin),
          # which is not on a GitHub runner's PATH by default.
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          command -v moon >/dev/null || {
            echo "::error::moon is still not on PATH after the install script"
            exit 1
          }
          moon version --all
      # Insurance, not a requirement. Since 0.4.45 this module has NO registry
      # dependency at all: the async runtime is `moonbitlang/core/async`, which
      # the toolchain itself bundles, so a fresh runner resolves everything it
      # needs without touching mooncakes.io. `moon update` is kept because a
      # future dependency would need a warm index, and a warm index costs
      # nothing -- but the commands below no longer fail without it.
      - name: Resolve the registry index
        run: moon update
      # --deny-warn per the official package-configuration guidance ("In CI, add
      # --deny-warn to moon check, moon test, or the equivalent command to treat
      # enabled warnings as fatal errors"). Without it this gate passes on a
      # warning regression, while both READMEs claim "0 errors, 0 warnings".
      - name: moon check
        run: moon check --deny-warn
      - name: moon fmt --check
        run: moon fmt --check
      - name: moon test
        run: moon test --target js --deny-warn
      # 0611. THE WASM RUN IS NOT A SECOND COPY OF THE JS ONE, IT IS THE OTHER
      # HALF OF THE SUITE, and this gate ran only one of them.
      #
      # MEASURED, on this tree, on the same commit: the js run is 1613 tests
      # and the wasm run is 1763. The difference is 150 tests, and every one
      # of them is in `src/sa` -- the 142 it already had, plus the 8 this
      # increment adds. `src/jsoncli` is skipped by the js run for the same
      # reason and carries no test file of its own. The two packages declare
      # `supported_targets = "+wasm+native"`, because js has no async runtime
      # and those packages need one. So the js run SKIPS them rather than
      # failing them, and the renderer, the scanner, the mermaid drawing
      # and the provenance were NOT RUN BY THIS GATE AT ALL.
      #
      # The README already says so -- "the wasm number is the only one that
      # covers the renderer and the scanner" -- and this gate contradicted it.
      # A regression in `src/sa` reached a tag behind a green CI badge, which
      # is the exact failure `_verify/release.ps1` opens by saying that CI is
      # "much smaller than what this project actually relies on".
      #
      # THE LOCAL GATE ALREADY RUNS BOTH (js, wasm and wasm-gc), so this
      # change makes CI agree with the gate that ships the release rather
      # than inventing a new rule. And it is a separate STEP, so a failure
      # says which target failed instead of leaving one red row to interpret.
      - name: moon test (wasm)
        run: moon test --target wasm --deny-warn
      - name: The wasm target must build
        # This is the target mooncakes compiles server-side into the artifact
        # that skills.mooncakes.io links and moonx downloads, so a wasm-only
        # regression that the js checks above cannot see would otherwise ship.
        run: moon build --target wasm
      # 0650. THE SCAN RECORD. Both READMEs publish a MEASUREMENT taken on
      # SOMEBODY ELSE'S package -- `riantr/LunaFlow` -- and the row names the
      # two versions it was measured on. A row that names versions goes stale
      # the moment either package is published again, and nothing noticed until
      # a reader compared the README with the registry.
      #
      # CI cannot REVISE a published README -- the registry freezes the bytes at
      # publish time -- but it CAN say, on every push, whether the row still
      # holds. That is what this step does: it re-measures the record against the
      # registry and turns a drift into a red build.
      #
      # THE EXIT CODES ARE THREE, and the step reads all three:
      #   0  every claim holds.
      #   1  a claim is FALSE -- the versions moved, or a README quotes a number
      #      the pin does not hold. RED, because that is the drift signal.
      #   2  a claim could not be MEASURED -- the registry did not answer, or
      #      `moonx` was missing, or the running compiler is not the one the
      #      record was measured with. NOT red: a network outage is not a defect
      #      in this repository. But it is printed, because "not measured" and
      #      "measured, and fine" are not the same statement.
      #
      # `moonx` IS AVAILABLE HERE: the installer the step above runs creates it
      # as a symlink to `moon`, and the scan is run OUTSIDE the repository --
      # `moonx` creates `.repos/` under the CURRENT directory, and a repository
      # that keeps its own `.repos/` would have the fetched package written into
      # the tree its measurements are taken against. The gate enforces that.
      - name: The published scan record (the READMEs' row about somebody else's package)
        run: |
          set -uo pipefail
          command -v pwsh >/dev/null || {
            echo "::error::pwsh is not on this runner, so the scan-record gate cannot run"
            exit 1
          }
          pwsh -NoProfile -File _verify/check_lunaflow_scan.ps1 -Live
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::the published scan record does not hold any more. Re-measure it, re-pin the READMEs, and re-commit the capture."
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::the scan record was NOT re-measured. That is not a pass."
          elif [ "$code" -ne 0 ]; then
            echo "::error::the scan-record gate exited $code, which is not one of its three verdicts."
            exit 1
          fi
          exit 0
